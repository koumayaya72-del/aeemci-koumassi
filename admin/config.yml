backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  # ==========================================================================
  # COLLECTION 1 : ACTUALITÉS & ÉVÉNEMENTS
  # ==========================================================================
  - name: "actualites"
    label: "Actualités & Événements"
    folder: "content/actualites"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titre de l'événement", name: "title", widget: "string" }
      - { label: "Catégorie / Badge", name: "badge", widget: "select", options: ["FORMATION", "ÉVÉNEMENT", "SPIRITUALITÉ", "EXCELLENCE", "ACTION SOCIALE", "PROCHAIN ÉVÉNEMENT"] }
      - { label: "Date de l'événement", name: "date", widget: "string" }
      - { label: "Image principale (Upload)", name: "image", widget: "image" }
      - { label: "Description courte", name: "description", widget: "text" }
      - { label: "Communiqué officiel complet", name: "communique", widget: "markdown", required: false }

  # ==========================================================================
  # COLLECTION 2 : MEMBRES DU BUREAU
  # ==========================================================================
  - name: "bureau"
    label: "Membres du Bureau Exécutif"
    folder: "content/bureau"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom & Prénoms", name: "title", widget: "string" }
      - { label: "Rôle / Fonction", name: "role", widget: "string" }
      - { label: "Pôle d'action", name: "pole", widget: "select", options: ["Pôle 1 : Présidence & Secrétariat Général", "Pôle 2 : Trésorerie & Commissariat aux Comptes", "Pôle 3 : Secrétariats d'Action & Commissions"] }
      - { label: "Photo de profil (Upload)", name: "photo", widget: "image" }

  # ==========================================================================
  # COLLECTION 3 : PROCHAIN GRAND RENDEZ-VOUS (BANNIÈRE ACCUEIL)
  # ==========================================================================
  - name: "prochain_evenement"
    label: "Bannière Compte à Rebours (Accueil)"
    files:
      - file: "content/prochain_evenement.json"
        label: "Paramètres de l'Événement Compte à Rebours"
        name: "prochain_evenement"
        fields:
          - { label: "Titre de l'événement", name: "title", widget: "string" }
          - { label: "Thème / Sous-titre", name: "theme", widget: "string" }
          - { label: "Date cible ISO (ex: 2026-08-25T20:00:00)", name: "target_date", widget: "string" }
          - { label: "Lieu officiel", name: "location", widget: "string" }
          - { label: "Affiche officielle (Upload)", name: "poster", widget: "image" }
          - { label: "Lien de réservation WhatsApp", name: "whatsapp_link", widget: "string" }
